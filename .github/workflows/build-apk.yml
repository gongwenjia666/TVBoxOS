name: Build TVBoxOS APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 原地拉取自己仓库的 TVBoxOS 源码
        uses: actions/checkout@v4

      - name: 2. 配置黄金兼容版本的 Java 11 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'
          cache: 'gradle'

      - name: 3. 赋予 gradlew 脚本执行权限
        run: chmod +x gradlew

      - name: ✨ 4. 终极覆盖：使用环境变量强行注入 Linux 系统的 Python 路径
        run: |
          # 1. 创建 local.properties 文件
          touch local.properties
          echo "sdk.dir=/usr/lib/android-sdk" > local.properties
          
          # ✨【终极修复】直接把 Linux 系统的 python 路径写入本地配置文件，强行覆盖代码里写死的 D 盘路径
          # 根据官方文档，在 local.properties 中写入 chaquopy.buildPython 可以拥有最高优先级覆盖权
          echo "chaquopy.buildPython=/usr/bin/python3" >> local.properties
          
          # 2. 强行切到 Debug 编译模式防止签名报错
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' app/build.gradle || true
          
          # 3. 清理掉之前所有失败的残留缓存
          ./gradlew clean

      - name: 5. 纯净编译通用 APK 
        run: ./gradlew :app:assembleDebug -x test -x lint --no-daemon

      - name: 6. 将打包好的成品 APK 发布到网页供下载
        uses: actions/upload-artifact@v4
        with:
          name: TVBoxOS-Custom-APK
          path: app/build/outputs/apk/**/*.apk
